    <title>VAE Manager</title>
    <script>
      // Apply the saved theme before first paint (no flash)
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('vae-theme') || 'dark'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name=theme-color]').content = dark ? '#000000' : '#f2f2f7';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
